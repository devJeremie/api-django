services:
  db:
    image: mysql:8
    restart: unless-stopped
    env_file: .env
    ports:
      # Port hôte 3307, pas 3306 : cette machine fait déjà tourner un MySQL
      # local sur 3306 pour le dev hors Docker (HOST/PORT par défaut dans
      # api/settings.py), donc le 3306 du conteneur est republié sur 3307
      # pour éviter un conflit de bind. En interne, `web` accède toujours à
      # ce service sur le port 3306 (le réseau interne de Docker n'est pas
      # affecté par le mapping côté hôte) — voir DB_HOST/DB_PORT dans .env.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # `web` attend ce healthcheck (depends_on ci-dessous) plutôt que juste
    # "conteneur démarré" — MySQL met quelques secondes après le démarrage
    # avant d'être réellement prêt à accepter des connexions.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    # Monte tout le projet dans le conteneur (bind-mount) pour que
    # l'autoreload de manage.py runserver détecte les modifications du code
    # sans reconstruction d'image.
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Volume nommé pour que les données MySQL survivent à `docker-compose down`
  # (seul `down -v` le supprime) — nécessaire car MYSQL_ROOT_HOST (.env) ne
  # prend effet qu'à la première initialisation de ce volume ; le modifier
  # plus tard nécessite une réinitialisation.
  mysql_data:
