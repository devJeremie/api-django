services:
  db:
    image: mysql:8
    restart: unless-stopped
    env_file: .env
    ports:
      # Host port 3307, not 3306: this machine already runs a local MySQL on
      # 3306 for non-Docker dev (api/settings.py's default HOST/PORT), so the
      # container's 3306 is republished on 3307 to avoid a bind conflict.
      # Internally, `web` still reaches this service on port 3306 (Docker's
      # internal network is unaffected by the host-side mapping) — see
      # DB_HOST/DB_PORT in .env.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # `web` waits for this healthcheck (depends_on below) instead of just
    # "container started" — MySQL takes a few seconds after start before
    # it's actually ready to accept connections.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    # Bind-mounts the whole project into the container so manage.py
    # runserver's autoreload picks up source edits without an image rebuild.
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Named volume so MySQL data survives `docker-compose down` (only
  # `down -v` removes it) — needed since MYSQL_ROOT_HOST (.env) only takes
  # effect on first init of this volume; changing it later requires a reset.
  mysql_data:
